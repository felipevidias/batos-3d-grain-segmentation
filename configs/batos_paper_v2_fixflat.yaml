# batos-paper-v2-fixflat — FROZEN method under test (Phase 1f, 2026-11-06).
# No parameter, code or threshold of this method may change before the test results are reported.
# Method = batos-paper-v2-frozen (E-series code run verbatim, CLAUDE.md §2 Phase 1 status) with ONE change:
# the lambda=1 selector flatten adds back bg_ref = median(blur[blur >= 1]) instead of median(blur[blur > 0])
# (src/batos_v2/flatten_fixed.py --variant A; root cause in docs/CROP05_ROOT_CAUSE.md). Everything else is frozen.
# Development result (12 SIBGRAPI crops): results/batos_v2_fixflat/REPORT.md (ToS = sel macro F1@0.50 0.976).
preset: batos-paper-v2-fixflat
git_tag: batos-paper-v2-fixflat
git_commit_of_tag: 856c24877e0067d7c0bcb30854aec54d3db57436
frozen_on: 2026-11-06
status: frozen_for_test

method:
  base: batos-paper-v2-frozen          # python -I -m batos_v2.frozen (verbatim recovered scripts, flags in frozen.py)
  change:
    stage: pipeline_1_flatten_lambda1
    replaced_by: batos_v2.flatten_fixed --variant A
    bg_ref: median(blur[blur >= 1])     # frozen: median(blur[blur > 0])
  unchanged:
    scale: e13_estimate_scale (GT-free, 12-row manifest per crop set)
    openrec_radius: max(8, round(1.5 * R_hat))
    selector_lambda_xy: 1.0
    tos_selector: true_dual K=3600 (1800 MIN + 1800 MAX), tau_s=0.35, area factor 22, area 2-2200
    markers: e11 ToS-MIN, NMS 6, EDT weight 0.20
    boundary_rule: batos_background internal_dark (face-connected dark rejected)
    gate: E23c median(region_voxels) <= 3 and q75 <= 4 -> EDT-Otsu matched count (kept, expected inactive)
    mask: Otsu (no offset) on the openrec image, closing 1, fill holes, components >= 500, U ToS-MIN + baseline
    watershed: e11_run_fixed_mask_watershed connectivity 1
  evaluation:
    protocol: seed_ignore (e09b, paper Sec. III-C), IoU 0.25 / 0.50 / 0.75
    gt_valid: >= 1000 voxels and not touching a crop face
    size_filter: [none (primary), 500 (no relabel)]
    routes: [BA-TOS_ToS, BA-TOS_sel]
    tables: crop-macro (mean, sample SD, median, min) and pooled objects, kept separate

drivers:   # documentation only (no method parameter): how the method is run
  frozen_reference: python -I -m batos_v2.frozen --crops-json <json> --runs-root <root> --crop-id <id> [--openrec-impl auto]
  fixflat_dev: python -I -m batos_v2.flatten_fix_run --variants A --root <root> --label <label>  (dev crops)
  test_protocol: python -I scripts/run_test_protocol.py  (frozen + fixflat on data/metadata/crops_test.json)
  aggregation: scripts/aggregate_fixflat.py (dev), scripts/aggregate_test_protocol.py (test)

