# batos-paper-v3-scalefree — FROZEN method under test (Phase 5e step 4).
# Designed on the 12 EFR dev crops + synthetic scale test only. No parameter, code or threshold may change
# before the 52-crop test results are reported. scripts/run_test_v3.py checks every hash below.
preset: batos-paper-v3-scalefree
